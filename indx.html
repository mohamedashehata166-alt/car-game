<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Racer</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

#hud{
font-size:25px;
padding:10px;
}

#game{
width:400px;
height:600px;
margin:auto;
position:relative;
overflow:hidden;
background:#333;
border:4px solid white;
}

.lane{
position:absolute;
width:8px;
height:100%;
background:
repeating-linear-gradient(
to bottom,
white 0px,
white 40px,
transparent 40px,
transparent 80px
);
}

.lane1{
left:132px;
}

.lane2{
left:264px;
}

#player{
position:absolute;
width:60px;
height:90px;
font-size:55px;
bottom:20px;
left:170px;
display:flex;
justify-content:center;
align-items:center;
}

.enemy{
position:absolute;
width:60px;
height:90px;
font-size:55px;
display:flex;
justify-content:center;
align-items:center;
}

#gameover{
display:none;
position:absolute;
top:220px;
width:100%;
font-size:35px;
font-weight:bold;
color:red;
z-index:10;
}

#controls{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-top:10px;
}

#controls button{
font-size:32px;
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
}

#restartBtn{
display:none;
background:#22c55e;
color:white;
}

</style>
</head>

<body>

<div id="hud">
🏆 Score:
<span id="score">0</span>
</div>

<div id="game">

<div class="lane lane1"></div>
<div class="lane lane2"></div>

<div id="player">🚘</div>

<div id="gameover">
💥 GAME OVER
</div>

</div>

<div id="controls">

<button onclick="moveLeft()">
⬅️
</button>

<button id="restartBtn" onclick="restartGame()">
🔄
</button>

<button onclick="moveRight()">
➡️
</button>

</div>

<script>

const player=document.getElementById("player");

const lanes=[35,170,305];

let laneIndex=1;

let score=0;

let gameOver=false;

function moveLeft(){

if(gameOver)return;

laneIndex--;

if(laneIndex<0){
laneIndex=0;
}

player.style.left=
lanes[laneIndex]+"px";
}

function moveRight(){

if(gameOver)return;

laneIndex++;

if(laneIndex>2){
laneIndex=2;
}

player.style.left=
lanes[laneIndex]+"px";
}

document.addEventListener("keydown",(e)=>{

if(
e.key==="ArrowLeft" ||
e.key==="a" ||
e.key==="A"
){
moveLeft();
}

if(
e.key==="ArrowRight" ||
e.key==="d" ||
e.key==="D"
){
moveRight();
}

});

function createEnemy(){

if(gameOver)return;

let enemy=
document.createElement("div");

enemy.className="enemy";

let cars=[
"🚙",
"🚕",
"🚐",
"🚔"
];

enemy.innerHTML=
cars[Math.floor(Math.random()*cars.length)];

let randomLane=
Math.floor(Math.random()*3);

enemy.style.left=
lanes[randomLane]+"px";

enemy.style.top="-100px";

document.getElementById("game")
.appendChild(enemy);

let move=setInterval(()=>{

if(gameOver){

clearInterval(move);

return;
}

let top=
parseInt(enemy.style.top);

top+=7;

enemy.style.top=
top+"px";

let p=
player.getBoundingClientRect();

let e=
enemy.getBoundingClientRect();

if(
p.left<e.right &&
p.right>e.left &&
p.top<e.bottom &&
p.bottom>e.top
){

gameOver=true;

document.getElementById("gameover")
.style.display="block";

document.getElementById("restartBtn")
.style.display="inline-block";
}

if(top>650){

enemy.remove();

clearInterval(move);

score+=10;

document.getElementById("score")
.innerText=score;
}

},20);

}

setInterval(createEnemy,1200);

function restartGame(){

location.reload();

}

</script>

</body>
</html>
